name: auto-merge

# Turns on squash auto-merge for every non-draft PR from a branch in the
# calling repo, so it merges once the required checks pass. Fork PRs and
# Dependabot PRs are left alone (dependabot-automerge.yml handles those).
# sm-core runs it on its own PRs too (the pull_request trigger).
#
# Human stop: a PR carrying the `hold-label` label (default `hold`) never
# gets auto-merge. Adding the label turns auto-merge off; removing it turns
# it back on. A person merges a held PR, or removes the label.
#
# Caller:
#   on:
#     pull_request:
#       types: [opened, ready_for_review, reopened, labeled, unlabeled]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     auto-merge:
#       uses: scottwmacleod/sm-core/.github/workflows/auto-merge.yml@v26.11.2
#       # with:
#       #   hold-label: hold

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled, unlabeled]
  workflow_call:
    inputs:
      hold-label:
        description: A PR with this label never gets auto-merge.
        type: string
        default: hold

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Label changes in quick succession settle on the last one.
  group: sm-auto-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Label events for any other label change nothing, so they skip.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == (inputs.hold-label || 'hold')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Hold or auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
          HELD: ${{ contains(github.event.pull_request.labels.*.name, inputs.hold-label || 'hold') }}
          HOLD_LABEL: ${{ inputs.hold-label || 'hold' }}
        run: |
          if [ "$HELD" = true ]; then
            echo "Labelled $HOLD_LABEL: auto-merge stays off."
            if [ -n "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
              gh pr merge --disable-auto "$PR_URL"
            fi
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
