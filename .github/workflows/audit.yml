name: audit

# Dependency advisories via `npm audit`. Deliberately not a required check: a
# new advisory can turn this red on an unrelated PR or on the weekly run.
#
# Caller:
#   on:
#     pull_request:
#       paths: ["**/package.json", "**/package-lock.json"]
#     push:
#       branches: [main]
#     schedule:
#       - cron: "43 5 * * 1"
#   permissions:
#     contents: read
#   jobs:
#     audit:
#       uses: scottwmacleod/sm-core/.github/workflows/audit.yml@v26.11.1

on:
  workflow_call:
    inputs:
      workspace:
        type: string
        default: "."
      audit-level:
        type: string
        default: high

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Audit production and development dependencies
        run: npm audit --audit-level=${{ inputs.audit-level }}
