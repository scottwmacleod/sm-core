name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  web:
    uses: ./.github/workflows/web-ci.yml
    with:
      lint-command: ""
      typecheck-command: ""
      test-command: npm run check
      build-command: ""
      skip-paths: '^(README\.md|CLAUDE\.md)$'
      lint-budget-seconds: 30
      test-budget-seconds: 45

  web-bun:
    uses: ./.github/workflows/web-ci.yml
    with:
      workspace: scripts/fixtures/bun-caller
      package-manager: bun
      typecheck-command: ""
      skip-paths: '^(README\.md|CLAUDE\.md)$'
      lint-budget-seconds: 30
      test-budget-seconds: 45
      build-budget-seconds: 30
      e2e: true
      e2e-shards: 2
      e2e-budget-seconds: 10

  ci:
    needs: [web, web-bun]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.web.result }}" = success && test "${{ needs.web-bun.result }}" = success
